name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          # Windows does not build yet. The local browser connection and the
          # app-server transport are written against POSIX pipes and poll, and the
          # Windows equivalents have not been written. This job is allowed to fail so
          # the signal for it stays visible without turning every run red. Remove
          # continue-on-error when the transport lands.
          - name: windows (needs a port)
            os: windows-latest
            continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # No packages to install: CMake uses a system nlohmann_json when it finds one and
      # fetches the single header when it does not, so every platform configures the
      # same way with only a compiler present.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: swapdex-${{ matrix.name }}
          path: |
            build/swapdex
            build/swapdex.exe
            build/Release/swapdex.exe
          if-no-files-found: error
